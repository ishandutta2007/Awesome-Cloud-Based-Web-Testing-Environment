<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.12)" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes beamSlide {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .anim-float1 { animation: floatSlow 8s ease-in-out infinite; }
      .anim-float2 { animation: floatReverse 7s ease-in-out infinite; }
      .anim-glow { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .anim-beam { stroke-dasharray: 80 120; animation: beamSlide 6s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs (in background) -->
  <circle cx="200" cy="100" r="180" fill="url(#glowGrad1)" class="anim-glow" />
  <circle cx="1020" cy="300" r="220" fill="url(#glowGrad2)" class="anim-glow" style="animation-delay: -2.5s;" />

  <!-- Animated Ambient Grid Data Lines (in background) -->
  <path d="M 50 80 Q 300 30 600 70 T 1150 50" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.3" class="anim-beam" />
  <path d="M 80 340 Q 400 380 750 320 T 1120 350" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.25" class="anim-beam" style="animation-direction: reverse;" />

  <!-- Interactive Decorative Floating Badges (Floating softly on sides) -->
  <g class="anim-float1">
    <g transform="translate(60, 240)">
      <rect width="170" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="24" cy="21" r="7" fill="#38bdf8" />
      <text x="42" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ Distributed Grids</text>
    </g>
    <g transform="translate(80, 160)">
      <rect width="150" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="24" cy="21" r="7" fill="#818cf8" />
      <text x="42" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">☁️ Real Browsers</text>
    </g>
  </g>

  <g class="anim-float2">
    <g transform="translate(970, 130)">
      <rect width="170" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="24" cy="21" r="7" fill="#a855f7" />
      <text x="42" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🚀 Zero Infrastructure</text>
    </g>
    <g transform="translate(950, 215)">
      <rect width="180" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="24" cy="21" r="7" fill="#ec4899" />
      <text x="42" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🧪 Automated &amp; Live</text>
    </g>
  </g>

  <!-- Foreground Main Title & Content (Crisp, High Contrast, Centered) -->
  <!-- Top Category Chip -->
  <g transform="translate(435, 65)">
    <rect width="330" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="url(#accentGrad)" stroke-width="1.5" />
    <text x="165" y="21" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Headline Title -->
  <text x="600" y="160" text-anchor="middle" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    Cloud-Based Web Testing Environment
  </text>

  <!-- Subtitle -->
  <text x="600" y="205" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="0.2">
    Cross-Browser Clouds, Remote Browser Automation &amp; Kubernetes Grids
  </text>

  <!-- Tagline Summary -->
  <text x="600" y="240" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
    Comprehensive directory of high-scale SaaS platforms and open-source self-hosted browser infrastructures
  </text>

  <!-- Bottom Visual Indicator Bar -->
  <g transform="translate(480, 290)">
    <rect width="240" height="4" rx="2" fill="url(#accentGrad)" />
  </g>
</svg>